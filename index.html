nav.chips{position:sticky;top:0;z-index:50;background:var(--bg);padding-top:4px}

  if(la>21.5&&la<25.6&&lo>119&&lo<122.5)res('tw');else if(Math.hypot((la-36.93)*111,(lo-138.81)*90)<45||Math.hypot((la-36.92)*111,(lo-138.44)*90)<45)res('ys');else if(la>30&&la<46&&lo>128&&lo<146)res((()=>{const w=WARDS.map(x=>[x[0],Math.hypot((la-x[1])*111,(lo-x[2])*90)]).sort((a,b)=>a[1]-b[1])[0];return w[1]<2.5?w[0]:'tk'})());else res(null)},()=>res(null),{timeout:8000,maximumAge:600000})})}

/* 拖曳把手排序：用 transform 移動，放開後才寫入 */
function dragInit(){
 const box=$('#sl');if(!box)return;
 box.querySelectorAll('.hdl').forEach(hd=>hd.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const items=[...box.querySelectorAll('.swr')],el=hd.closest('.swr'),idx=items.indexOf(el);
  box.querySelectorAll('.pn,.lgf').forEach(p=>p.style.display='none');
  const R=items.map(x=>{const r=x.getBoundingClientRect();return{top:r.top+scrollY,h:r.height}});
  const gap=6,hE=R[idx].h+gap,y0=e.pageY;let tgt=idx;
  el.classList.add('dragging');try{hd.setPointerCapture(e.pointerId)}catch(_){}
  const mv=ev=>{
   const dy=ev.pageY-y0;el.style.transform=`translateY(${dy}px)`;
   const c=R[idx].top+R[idx].h/2+dy;let t=0;R.forEach((r,j)=>{if(j!==idx&&r.top+r.h/2<c)t++});tgt=t;
   items.forEach((x,j)=>{if(j===idx)return;let s=0;if(idx<tgt&&j>idx&&j<=tgt)s=-hE;else if(tgt<idx&&j>=tgt&&j<idx)s=hE;x.style.transform=s?`translateY(${s}px)`:''});
   const vy=ev.clientY;if(vy<80)scrollBy(0,-12);else if(vy>innerHeight-110)scrollBy(0,12)};
  const up=()=>{hd.removeEventListener('pointermove',mv);hd.removeEventListener('pointerup',up);hd.removeEventListener('pointercancel',up);
   items.forEach(x=>{x.style.transform=''});el.classList.remove('dragging');
   if(tgt!==idx){const ids=items.map(x=>x.dataset.id);const[m]=ids.splice(idx,1);ids.splice(tgt,0,m);persistOrder(ids)}else planView()};
  hd.addEventListener('pointermove',mv);hd.addEventListener('pointerup',up);hd.addEventListener('pointercancel',up)}));
}

/* ===== 白天／傍晚／夜晚（依場景當地時間，也可手動切換看看） ===== */
let TOD=null,lastPh=null;
function localMin(tz){try{const p=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:tz}).formatToParts(new Date());return (+p.find(x=>x.type==='hour').value%24)*60+(+p.find(x=>x.type==='minute').value)}catch(e){const d=new Date();return d.getHours()*60+d.getMinutes()}}
const timeIn=tz=>{try{return new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:tz}).format(new Date())}catch(e){return ''}};
function autoPhase(loc){const m=localMin(loc==='tw'?'Asia/Taipei':'Asia/Tokyo');const rise=loc==='tw'?390:410,set=loc==='tw'?1050:1020;
 if(m>=rise+45&&m<set-60)return 'day';if((m>=rise-45&&m<rise+45)||(m>=set-60&&m<set+75))return 'dusk';return 'night'}
const curPhase=loc=>TOD||autoPhase(loc);
function drawBg(){const b=$('#bg');if(!b)return;lastPh=curPhase(me.loc);const w=lobbyWx();WXN=w;lastWxSig=w.k+w.w;b.innerHTML=buildScene(me.loc,lastPh);const f=$('#fl');if(f)f.innerHTML=wxFx(w,me.loc,lastPh);const t=$('#tod');if(t)t.textContent=PHASES[lastPh].name+(TOD?'':'・自動');wxBtn();fetchWx(me.loc)}
function cycleTod(){const o=[null,'day','dusk','night'];TOD=o[(o.indexOf(TOD)+1)%o.length];drawBg()}
setInterval(()=>{if(!TOD&&$('#bg')&&me&&me.loc&&autoPhase(me.loc)!==lastPh)drawBg()},30000);

/* ===== 匯率跑馬燈（即時匯率） ===== */
let FX=(()=>{try{return JSON.parse(localStorage.getItem('fx'))}catch(e){return null}})();
const fxAt=d=>`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
async function fetchFx(){
 const tries=[
  async()=>{const j=await (await fetch('https://open.er-api.com/v6/latest/JPY')).json();if(j&&j.rates&&j.rates.TWD)return{r:+j.rates.TWD,src:'ExchangeRate-API'}},
  async()=>{const j=await (await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/jpy.json')).json();if(j&&j.jpy&&j.jpy.twd)return{r:+j.jpy.twd,src:'currency-api'}},
  async()=>{const j=await (await fetch('https://latest.currency-api.pages.dev/v1/currencies/jpy.json')).json();if(j&&j.jpy&&j.jpy.twd)return{r:+j.jpy.twd,src:'currency-api'}}];
 for(const t of tries){try{const o=await t();if(o&&o.r>0.05&&o.r<1){FX={r:o.r,src:o.src,at:fxAt(new Date()),ts:Date.now()};try{localStorage.setItem('fx',JSON.stringify(FX))}catch(e){}renderTicker(true);return true}}catch(e){}}
 return false}
function renderTicker(force){
 const el=$('#tkr');if(!el)return;const live=!!(FX&&FX.r),r=live?FX.r:rate();
 const sig=live?FX.r+'|'+FX.at:'x'+r;if(!force&&el.dataset.sig===sig)return;el.dataset.sig=sig;
 const f=n=>Math.round(n).toLocaleString('en-US');
 const items=[`${live?'即時匯率':'參考匯率'}　¥1 ＝ NT$${r.toFixed(4)}`,`NT$1 ＝ ¥${(1/r).toFixed(2)}`,`¥1,000 ＝ NT$${f(1000*r)}`,`¥10,000 ＝ NT$${f(10000*r)}`,`NT$1,000 ＝ ¥${f(1000/r)}`,`東京 <b class="tkc" data-tz="Asia/Tokyo">${timeIn('Asia/Tokyo')}</b>　台北 <b class="tkc" data-tz="Asia/Taipei">${timeIn('Asia/Taipei')}</b>`,live?`更新 ${FX.at}　來源 ${FX.src}`:'未取得即時資料，改用記帳頁的匯率'];
 const one=items.map(t=>`<span>${t}</span>`).join('<i>◆</i>')+'<i>◆</i>';
 const len=items.join('').replace(/<[^>]*>/g,'').length;
 el.innerHTML=`<div class="tkt" style="animation-duration:${Math.max(24,Math.round(len*.42))}s"><div class="tkh">${one}</div><div class="tkh" aria-hidden="true">${one}</div></div>`}
setInterval(()=>{document.querySelectorAll('.tkc').forEach(e=>{e.textContent=timeIn(e.dataset.tz)})},20000);
setInterval(()=>{if(!FX||Date.now()-FX.ts>30*60*1000)fetchFx()},5*60*1000);
function rateSheet(){const live=FX&&FX.r;openSheet(`<h3 style="margin:0 0 6px">更新匯率</h3>${live?`<div class="card" style="margin:0 0 8px"><div style="font-size:13px;opacity:.75">即時匯率（${esc(FX.at)}・${esc(FX.src)}）</div><b style="font-size:20px">¥1 ＝ NT$${FX.r.toFixed(4)}</b><button class="big" id="rl" style="margin-top:8px">套用即時匯率給四個人</button></div>`:'<div style="font-size:13px;opacity:.75">目前抓不到即時匯率，可以手動填。</div>'}<div class="lab">或手動輸入：1 日圓 = 幾台幣</div><input type="number" step="0.0001" inputmode="decimal" id="rv" value="${rate()}"><button class="big ghost" id="rs">儲存手動匯率</button><button class="big ghost" id="rx">取消</button>`);
 $('#rx').onclick=closeSheet;const A=v=>{closeSheet();saveInfo({rate:v,rateAt:new Date().toLocaleDateString('zh-TW')+' · '+(me.name||'')})};

/* ===== 天氣（Open-Meteo，免金鑰）＋ 大廳天氣效果 ===== */
const WXL={tw:{n:'台灣',lat:25.033,lon:121.565},tk:{n:'東京',lat:35.689,lon:139.692},ys:{n:'野澤雪場',lat:36.923,lon:138.441},ueno:{n:'上野',lat:35.714,lon:139.777},asakusa:{n:'淺草',lat:35.715,lon:139.797},shibuya:{n:'澀谷',lat:35.658,lon:139.702},shinjuku:{n:'新宿',lat:35.694,lon:139.703}};
const wxk=l=>WXL[l]?l:(l==='tw'||l==='ys'?l:'tk');
const WXI={sun:['☀️','晴'],cloud:['⛅','多雲'],overcast:['☁️','陰天'],rain:['🌧️','下雨'],storm:['⛈️','雷雨'],snow:['❄️','下雪'],fog:['🌫️','起霧'],none:['⏳','載入中']};
const WMO={0:'晴朗',1:'大致晴朗',2:'多雲',3:'陰天',45:'霧',48:'霧凇',51:'毛毛雨',53:'毛毛雨',55:'較強毛毛雨',56:'凍毛毛雨',57:'凍毛毛雨',61:'小雨',63:'中雨',65:'大雨',66:'凍雨',67:'強凍雨',71:'小雪',73:'中雪',75:'大雪',77:'冰粒',80:'陣雨',81:'較強陣雨',82:'強陣雨',85:'陣雪',86:'強陣雪',95:'雷雨',96:'雷雨伴冰雹',99:'強雷雨伴冰雹'};
const WXTTL=30*60*1000;
let WX={},WXP={},WXH={},WXO=null,lastWxSig='',wxSel=null;
(function(){try{Object.keys(WXL).forEach(k=>{const o=JSON.parse(localStorage.getItem('tk_wx_'+k)||'null');if(o&&o.cur&&Date.now()-o.ts<6*3600*1000)WX[k]=o})}catch(e){}})();
function wxClass(c){const code=c.weather_code;let k;
 if(code>=95)k='storm';else if([71,72,73,74,75,76,77,85,86].includes(code))k='snow';else if((code>=51&&code<=67)||(code>=80&&code<=82))k='rain';else if(code===45||code===48)k='fog';else if(code===3)k='overcast';else if(code===2)k='cloud';else k='sun';
 return {k,w:(c.wind_speed_10m>=28||c.wind_gusts_10m>=45)?1:0}}
const WXPRE=[null,{k:'sun',w:0,l:'晴'},{k:'cloud',w:0,l:'多雲'},{k:'overcast',w:0,l:'陰天'},{k:'rain',w:0,l:'下雨'},{k:'storm',w:0,l:'雷雨'},{k:'snow',w:0,l:'下雪'},{k:'sun',w:1,l:'風大'},{k:'rain',w:1,l:'風雨'}];
function lobbyWx(){if(WXO)return WXO;const d=me&&WX[wxk(me.loc)];if(d&&d.cur)return wxClass(d.cur);return {k:'none',w:0}}
function wxLabel(w){return w.l||((WXI[w.k]||WXI.none)[1]+(w.w?'・風大':''))}
function wxBtn(){const b=$('#wxb');if(!b)return;const w=lobbyWx(),d=me&&WX[wxk(me.loc)];const t=(!WXO&&d&&d.cur)?' '+Math.round(d.cur.temperature_2m)+'°':'';
 b.textContent=(WXI[w.k]||WXI.none)[0]+(w.w&&w.k!=='sun'?'💨':'')+' '+wxLabel(w)+t+(WXO?'・手動':'・即時')}
function cycleWx(){const i=WXO?WXPRE.findIndex(x=>x===WXO):0;WXO=WXPRE[(i+1)%WXPRE.length];drawBg()}
function wxUrl(l){return 'https://api.open-meteo.com/v1/forecast?latitude='+l.lat+'&longitude='+l.lon+'&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,cloud_cover,wind_speed_10m,wind_gusts_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,snowfall_sum,wind_speed_10m_max,sunrise,sunset&timezone=auto&forecast_days=16'}
function fetchWx(loc,force){
 loc=wxk(loc);const c=WX[loc];if(!force&&c&&c.cur&&Date.now()-c.ts<WXTTL)return Promise.resolve(c);

 if(k==='snow'){for(let i=0;i<46;i++){const s=2+((R(0,3))|0)*1.5;h+=`<i class="fk" style="left:${R(-10,105)}%;width:${s}px;height:${s}px;--dx:${wi?170:-24}px;animation-duration:${R(4,8)/(wi?1.6:1)}s;animation-delay:-${R(0,9)}s"></i>`}}
 if(k==='rain'||k==='storm'){const n=k==='storm'?96:62;for(let i=0;i<n;i++)h+=`<i class="rd" style="left:${R(-12,108)}%;height:${R(14,28)}px;--dx:${dx}px;--rot:${rot}deg;opacity:${R(.4,.85).toFixed(2)};animation-duration:${R(.42,.75).toFixed(2)}s;animation-delay:-${R(0,1).toFixed(2)}s"></i>`}
 if(k==='storm')h+='<div class="lt"></div>';
 if(k==='cloud'||k==='overcast'||k==='rain'||k==='storm'||k==='snow'){const n=k==='cloud'?3:5;for(let i=0;i<n;i++)h+=`<i class="dcl" style="--c:${cc};top:${R(3,32).toFixed(1)}%;width:${R(34,70).toFixed(0)}px;height:${R(9,14).toFixed(0)}px;animation-duration:${(wi?R(18,32):R(70,120)).toFixed(0)}s;animation-delay:-${R(0,60).toFixed(0)}s"></i>`}
 if(k==='fog')h+=`<div class="fgv" style="${ph==='night'?'background:linear-gradient(rgba(60,70,100,.5),rgba(70,80,110,.6))':ph==='dusk'?'background:linear-gradient(rgba(190,170,190,.4),rgba(200,180,195,.55))':''}"></div>`;
 if(wi){for(let i=0;i<18;i++)h+=`<i class="ws" style="top:${R(4,82).toFixed(1)}%;width:${R(40,100).toFixed(0)}px;animation-duration:${R(.7,1.5).toFixed(2)}s;animation-delay:-${R(0,1.5).toFixed(2)}s"></i>`;

 return h}

 const attach=s=>s.id?real.collection(s.c).doc(s.id).onSnapshot(s.n,s.e):real.collection(s.c).onSnapshot(s.n,s.e);

 realP.then(r=>{real=r;subs.forEach(s=>{if(!s.dead)s.un=attach(s)});const items=q.splice(0);sv();window.__pending=0;items.forEach(o=>{try{run(o)}catch(e){}});watchConn();pillUpdate()});

function parseFlightText(text,today){

 /* 航班號碼：航空公司代碼必須是常見代碼（容許 OCR 把 I 讀成 1 之類） */

  trs.forEach(x=>R[fo(x.i)].terms.push(x));gts.forEach(x=>R[fo(x.i)].gates.push(x));aps.forEach(x=>R[fo(x.i)].aps.push(x));return R};

 const E=expList(),{b,out}=settle(),ids=allIds(),P=payList(),tot=E.filter(e=>!memX(memOf(e.by))).reduce((s,e)=>s+e.amt,0),so=E.filter(selfOnly);
 let h=`<div class="card"><b>💴 即時平帳</b><span style="float:right;opacity:.7;font-size:13px">總共 ¥${fnum(tot)} ≈ NT$${fnum(tot*rate())}</span>`;
 h+=out.length?out.map(([f,t,m])=>`<div class="kv"><span>${esc(nameOf(f))} → ${esc(nameOf(t))}</span><b class="neg">¥${fnum(m)}<small style="font-weight:400"> ≈NT$${fnum(m*rate())}</small></b><button class="opt payb" data-pay="${esc(f)}|${esc(t)}|${Math.round(m)}">✅ 已還</button></div>`).join(''):`<div style="opacity:.7;font-size:13px;margin-top:6px">${P.length?'🎉 目前都已經還清了':'目前沒有人欠錢 🎉'}</div>`;
 if(so.length)h+=`<div class="ysm warn" style="margin-top:8px">⚠️ 有 ${so.length} 筆花費只分給「付款人自己」，所以不會有人欠錢。點下面那筆花費，改成「全員平分」就會算出來。</div>`;
 h+=`<div class="lab" style="margin-top:10px">每人淨額</div>`+ids.map(i=>`<div class="kv"><span>${esc(nameOf(i))}</span><b class="${(b[i]||0)>=0?'pos':'neg'}">${(b[i]||0)>=0?'+':'−'}¥${fnum(Math.abs(b[i]||0))}</b></div>`).join('')+`</div>`;
 h+=`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div style="min-width:0"><b>👥 分帳成員：${ids.length} 人</b><div style="font-size:12px;opacity:.7;word-break:break-all">${ids.map(i=>esc(nameOf(i))).join('、')}</div></div><button class="opt" id="mbm">管理</button></div>`;
 h+=`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b>匯率 ¥1 = NT$${rate().toFixed(4)}</b><div style="font-size:12px;opacity:.65">${info.rateAt?'更新於 '+esc(info.rateAt):'預設估計值，出發前請更新'}</div></div><button class="opt" id="rt2">更新</button></div>`;
 if(P.length)h+=`<div class="card"><b>🧾 還款紀錄</b><span style="float:right;opacity:.7;font-size:13px">共 ¥${fnum(P.reduce((x,q)=>x+q.amt,0))}</span>${P.map(q=>`<div class="kv"><span>${esc(nameOf(memOf(q.f)))} → ${esc(nameOf(memOf(q.t)))}<div style="font-size:11px;opacity:.6">${new Date(q.ts).getMonth()+1}/${new Date(q.ts).getDate()} ${String(new Date(q.ts).getHours()).padStart(2,'0')}:${String(new Date(q.ts).getMinutes()).padStart(2,'0')} · ${esc(nameOf(q.by))} 記錄</div></span><b class="pos">¥${fnum(q.amt)}</b><button class="x" data-up="${q.id}" title="撤銷">↩</button></div>`).join('')}</div>`;
 h+=`<button class="big" id="ae">＋ 新增一筆花費</button>`;
 E.forEach(e=>{const ex=memX(memOf(e.by)),p=splitIds(e),all=!(e.sp&&e.sp.length)||p.length===ids.length,who=all?`全員平分（${p.length} 人）`:p.map(i=>esc(nameOf(i))).join('、')+' 分';
  h+=`<div class="stop ${ex?'exx':''}" data-e="${e.id}" style="cursor:pointer"><div style="flex:1;min-width:0"><b>${esc(e.t)}</b><div style="font-size:12px;opacity:.75">${esc(nameOf(memOf(e.by)))} 付 · ${ex?'付款人已排除，不計入':who}</div>${selfOnly(e)?'<div class="ywarn">⚠️ 只分給付款人自己，不會有人欠錢（點一下修改）</div>':''}</div><b style="text-align:right">¥${fnum(e.amt)}<div style="font-size:11px;opacity:.6;font-weight:400">${e.cur==='TWD'?'輸入 NT$'+fnum(e.orig):'≈NT$'+fnum(e.amt*rate())}</div></b><button class="x" data-x="${e.id}">✕</button></div>`});
 $('#view').innerHTML=h;$('#ae').onclick=()=>expSheet();$('#rt2').onclick=rateSheet;$('#mbm').onclick=memberSheet;
 $('#view').querySelectorAll('[data-e]').forEach(r=>r.onclick=()=>expSheet(r.dataset.e));
 $('#view').querySelectorAll('[data-pay]').forEach(x=>x.onclick=()=>{const[f,t,m]=x.dataset.pay.split('|');paySheet(f,t,+m)});
 $('#view').querySelectorAll('[data-up]').forEach(x=>x.onclick=()=>{if(!x.dataset.c){x.dataset.c=1;x.textContent='撤銷？';x.style.width='auto';x.style.padding='0 8px';setTimeout(()=>{if(x.isConnected){x.dataset.c='';x.textContent='↩';x.style.width='';x.style.padding=''}},3000);return}del('pay',x.dataset.up)});
 $('#view').querySelectorAll('[data-x]').forEach(x=>x.onclick=ev=>{ev.stopPropagation();if(!x.dataset.c){x.dataset.c=1;x.textContent='確定刪除？';x.style.width='auto';x.style.padding='0 8px';setTimeout(()=>{if(x.isConnected){x.dataset.c='';x.textContent='✕';x.style.width='';x.style.padding=''}},3000);return}del('exp',x.dataset.x)});
}
function expSheet(id){
 const e=id?D.exp[id]:null;if(id&&!e)return;const ids=allIds(),by0=e?memOf(e.by):memOf(uid),isAll=!e||!(e.sp&&e.sp.length),sel=new Set(e&&e.sp&&e.sp.length?e.sp.map(memOf):ids),e0=e?Object.assign({},e):null;
 const payers=ids.includes(by0)?ids:[by0,...ids],v0=e?(e.cur==='TWD'?e.orig:(e.orig!=null?e.orig:e.amt)):'';
 openSheet(`<h3 style="margin:0 0 6px">${e?'編輯花費':'新增花費'}</h3><div class="lab">項目</div><input type="text" id="et" placeholder="例：一蘭拉麵" value="${e?esc(e.t):''}"><div class="lab">金額</div><div style="display:flex;gap:6px"><select id="ec" style="width:105px"><option value="JPY" ${e&&e.cur==='TWD'?'':'selected'}>¥ 日圓</option><option value="TWD" ${e&&e.cur==='TWD'?'selected':''}>NT$ 台幣</option></select><input type="number" inputmode="decimal" id="ea" placeholder="3200" value="${v0}"></div><div id="ep" style="font-size:12px;opacity:.65;margin-top:4px"></div><div class="lab">誰付的</div><select id="eb">${payers.map(i=>`<option value="${i}">${esc(nameOf(i))}</option>`).join('')}</select>
 <div class="lab">分給誰</div><label class="opt" style="display:block;margin-bottom:6px"><input type="checkbox" id="eall" style="width:auto" ${isAll?'checked':''}> 全員平分（目前 ${ids.length} 人，之後加入的旅伴也會算進去）</label><div class="row" id="esp" style="${isAll?'display:none':''}">${ids.map(i=>`<label class="opt"><input type="checkbox" style="width:auto" data-s="${i}" ${sel.has(i)?'checked':''}> ${esc(nameOf(i))}</label>`).join('')}</div><div class="ywarn" id="ewn"></div>
 <button class="big" id="es">${e?'儲存':'儲存'}</button><button class="big ghost" id="ex">取消</button>`);
 $('#eb').value=by0;$('#ex').onclick=closeSheet;
 const pv=()=>{const a=parseFloat($('#ea').value)||0,t=$('#ec').value==='TWD';$('#ep').textContent=a?(t?`≈ ¥${fnum(a/rate())}`:`≈ NT$${fnum(a*rate())}`):''};$('#ea').oninput=pv;$('#ec').onchange=pv;pv();
 $('#eall').onchange=()=>{$('#esp').style.display=$('#eall').checked?'none':'flex'};
 $('#es').onclick=()=>{const t=$('#et').value.trim(),a=parseFloat($('#ea').value);if(!t||!(a>0))return;const all=$('#eall').checked,sp=all?[]:[...sheet.querySelectorAll('[data-s]')].filter(c=>c.checked).map(c=>c.dataset.s);
  if(!all&&!sp.length){$('#ewn').textContent='請至少勾選一個人，或選「全員平分」';return}
  const tw=$('#ec').value==='TWD',cur=tw?'TWD':'JPY',by=$('#eb').value;
  if(!e){closeSheet();put('exp',Date.now().toString(36)+uid.slice(0,3),{t,amt:tw?Math.round(a/rate()):a,cur,orig:a,by,sp,ts:Date.now()});return}
  const f={t,by,sp},ch={};if(f.t!==e0.t)ch.t=t;if(by!==memOf(e0.by))ch.by=by;if(JSON.stringify(sp)!==JSON.stringify(e0.sp||[]))ch.sp=sp;
  const o0=e0.cur==='TWD'?e0.orig:(e0.orig!=null?e0.orig:e0.amt);if(cur!==(e0.cur==='TWD'?'TWD':'JPY')||a!==o0){ch.cur=cur;ch.orig=a;ch.amt=tw?Math.round(a/rate()):a}
  closeSheet();if(Object.keys(ch).length){updFields('exp',id,ch);refresh()}else expView()};
}
/* 分帳成員：把測試帳號排除、把同一個人的兩台裝置合併 */
const agoTxt=ts=>{if(!ts)return '很久以前';const m=Math.round((Date.now()-ts)/60000);return m<2?'剛剛':m<60?m+' 分鐘前':m<1440?Math.round(m/60)+' 小時前':Math.round(m/1440)+' 天前'};
function memberSheet(){
 const known=[...new Set([uid,...Object.keys(players)])].filter(i=>i===uid||(players[i]&&players[i].name)),nm=i=>i===uid?(me.name||'我'):players[i].name;
 const dupName=i=>known.some(j=>j!==i&&nm(j)===nm(i));
 const rows=known.map(i=>{const v=info['mb_'+i]||'',opts=[['','✅ 正常參與分帳'],['x','🚫 不分帳（測試帳號／不去的人）']].concat(known.filter(j=>j!==i&&memOf(j)!==i).map(j=>['m:'+j,'🔗 跟「'+nm(j)+'」是同一個人（合併）']));
  return `<div class="mbr"><div><b>${esc(nm(i))}</b>${i===uid?'（你這台）':''}<div style="font-size:11px;opacity:.65">最後上線：${agoTxt(i===uid?Date.now():players[i].ts)}${dupName(i)?' · ⚠️ 名字重複，可能是同一人用兩台裝置':''}</div></div><select data-m="${i}">${opts.map(([k,l])=>`<option value="${esc(k)}" ${k===v?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`}).join('');
 openSheet(`<h3 style="margin:0 0 6px">分帳成員</h3><div style="font-size:12.5px;opacity:.8;line-height:1.5;margin-bottom:6px">「全員平分」會平分給這裡的每一位。測試用的帳號請設成「不分帳」；同一個人用了兩台手機，請把其中一個「合併」到另一個。大家共用這份設定，改了立刻同步。</div>${rows}<button class="big" id="mbx">完成</button>`);
 sheet.querySelectorAll('[data-m]').forEach(s=>s.onchange=()=>{saveInfo({['mb_'+s.dataset.m]:s.value});memberSheet()});
 $('#mbx').onclick=()=>{closeSheet();expView()};
}

function paySheet(f,t,m){
 openSheet(`<h3 style="margin:0 0 6px">記錄已還款</h3><div style="font-size:15px;margin:4px 0 8px"><b>${esc(nameOf(f))}</b> 還給 <b>${esc(nameOf(t))}</b></div><div class="lab">還了多少（日圓，可以只還一部分）</div><input type="number" inputmode="decimal" id="pa" value="${m}"><div id="pp" style="font-size:12px;opacity:.65;margin-top:4px"></div><div style="font-size:12px;opacity:.7;margin-top:6px;line-height:1.5">按下去只是「記錄」，不會真的轉帳。記錄後上面的欠款會自動扣掉，任何人都可以在下方「還款紀錄」撤銷。</div><button class="big" id="ps">✅ 記錄已還款</button><button class="big ghost" id="px">取消</button>`);
 const pv=()=>{const a=parseFloat($('#pa').value)||0;$('#pp').textContent=a?`≈ NT$${fnum(a*rate())}`:''};$('#pa').oninput=pv;pv();$('#px').onclick=closeSheet;
 $('#ps').onclick=()=>{const a=Math.round(parseFloat($('#pa').value));if(!(a>0))return $('#pa').focus();closeSheet();put('pay',Date.now().toString(36)+uid.slice(0,3),{f,t,amt:a,by:uid,ts:Date.now()})}}

(async()=>{
