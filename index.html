 const r=await fetch(u);if(!r.ok)throw new Error('素材清單讀取失敗（'+r.status+'）');const arr=await r.json();

function geoScene(){return new Promise(res=>{if(!navigator.geolocation)return res(null);
 navigator.geolocation.getCurrentPosition(p=>{const la=p.coords.latitude,lo=p.coords.longitude;
  if(la>21.5&&la<25.6&&lo>119&&lo<122.5)res('tw');else if(Math.hypot((la-36.93)*111,(lo-138.81)*90)<45)res('ys');else if(la>30&&la<46&&lo>128&&lo<146)res('tk');else res(null)},()=>res(null),{timeout:8000,maximumAge:600000})})}

/* 拖曳把手排序：用 transform 移動，放開後才寫入 */
function dragInit(){
 const box=$('#sl');if(!box)return;
 box.querySelectorAll('.hdl').forEach(hd=>hd.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const items=[...box.querySelectorAll('.swr')],el=hd.closest('.swr'),idx=items.indexOf(el);
  box.querySelectorAll('.pn,.lgf').forEach(p=>p.style.display='none');
  const R=items.map(x=>{const r=x.getBoundingClientRect();return{top:r.top+scrollY,h:r.height}});
  const gap=6,hE=R[idx].h+gap,y0=e.pageY;let tgt=idx;
  el.classList.add('dragging');try{hd.setPointerCapture(e.pointerId)}catch(_){}
  const mv=ev=>{
   const dy=ev.pageY-y0;el.style.transform=`translateY(${dy}px)`;
   const c=R[idx].top+R[idx].h/2+dy;let t=0;R.forEach((r,j)=>{if(j!==idx&&r.top+r.h/2<c)t++});tgt=t;
   items.forEach((x,j)=>{if(j===idx)return;let s=0;if(idx<tgt&&j>idx&&j<=tgt)s=-hE;else if(tgt<idx&&j>=tgt&&j<idx)s=hE;x.style.transform=s?`translateY(${s}px)`:''});
   const vy=ev.clientY;if(vy<80)scrollBy(0,-12);else if(vy>innerHeight-110)scrollBy(0,12)};
  const up=()=>{hd.removeEventListener('pointermove',mv);hd.removeEventListener('pointerup',up);hd.removeEventListener('pointercancel',up);
   items.forEach(x=>{x.style.transform=''});el.classList.remove('dragging');
   if(tgt!==idx){const ids=items.map(x=>x.dataset.id);const[m]=ids.splice(idx,1);ids.splice(tgt,0,m);persistOrder(ids)}else planView()};
  hd.addEventListener('pointermove',mv);hd.addEventListener('pointerup',up);hd.addEventListener('pointercancel',up)}));
}

 const extra=legs.length>2?`（另外辨識到 ${legs.length-2} 個航班未填入）`:'';
 st.innerHTML=`<div style="margin-top:8px;color:#2ecc71">✅ 已帶入 ${esc(names)}${extra}。綠框是辨識出來的欄位，<b>請逐項核對</b>；沒帶到的請手動補上。</div><details><summary style="opacity:.7;font-size:12px">看辨識原文</summary><pre style="white-space:pre-wrap;font-size:11px">${esc(text)}</pre></details>`}
let ocrBusy=false;
async function runOcr(file){if(ocrBusy||!file)return;ocrBusy=true;const st=$('#ocrst'),say=h=>{const e=$('#ocrst');if(e)e.innerHTML=`<div style="margin-top:8px">${h}</div>`};
 try{say('準備中…第一次使用要下載辨識元件，請稍候');const blob=await prepImage(file);await loadTess();
  let t1=await ocrRecog(blob,'eng',p=>say(`辨識中… ${p}%`)),legs=parseFlightText(t1),text=t1;
  if(!legs.length||legs.some(l=>!l.date||!l.dep||!l.arr)){
   try{say('補強辨識中文內容…第一次需下載較大的中文資料，請稍候');const t2=await ocrRecog(blob,'chi_tra+eng',p=>say(`中文辨識中… ${p}%`));legs=mergeLegs(legs,parseFlightText(t2));text=t1+'\n----\n'+t2}catch(e){}}
  applyOcr(legs,text)}
 catch(e){say('辨識失敗：'+esc(e.message||String(e))+'。可以改用手動填寫。')}
 finally{ocrBusy=false}}
document.addEventListener('paste',e=>{if(sheet.style.display!=='block'||!$('#ocrf'))return;const f=[...(e.clipboardData&&e.clipboardData.files||[])].find(x=>x.type&&x.type.startsWith('image/'));if(f){e.preventDefault();runOcr(f)}});

const LF=[['no','航班號碼','text','例：IT200'],['date','日期','date',''],['dep','起飛時間（當地）','time',''],['arr','抵達時間（當地）','time',''],['pnr','訂位代碼','text','確認信上的 6 碼'],['term','航廈','text','例：T2'],['gate','登機門','text','當天公布後再填']];
function legForm(k,L,fr,to){return `<div style="font-weight:700;margin-top:12px">${k=='o'?'🛫 去程（台灣 → 東京）':'🛬 回程（東京 → 台灣）'}</div>`+LF.map(([f,n,t,ph])=>`<div class="lab">${n}</div><input type="${t}" id="${k}_${f}" value="${esc(L[f]||'')}" placeholder="${ph}">`).join('')+`<div class="lab">起降機場</div><div style="display:flex;gap:6px"><select id="${k}_from">${fr.map(x=>`<option ${L.from==x?'selected':''}>${x}</option>`).join('')}</select><select id="${k}_to">${to.map(x=>`<option ${L.to==x?'selected':''}>${x}</option>`).join('')}</select></div>`}
function flySheet(){

 openSheet(`<h3 style="margin:0">我的航班</h3><div class="card" style="margin:8px 0"><b>📷 從截圖帶入</b><div style="font-size:12px;opacity:.7;margin:4px 0 8px">選一張有航班號碼、日期和時間的截圖（確認信、航空公司 App 都可以）。辨識在你的手機上完成，圖片不會上傳；辨識結果可能有錯，請逐項核對。</div><input type="file" id="ocrf" accept="image/*" style="display:none"><button class="opt" id="ocrb">選擇截圖</button><div id="ocrst"></div></div><div style="font-size:12px;opacity:.6">或在下方手動填寫：</div>${legForm('o',f.out||{},T,J)}${legForm('b',f.back||{},J,T)}<button class="big" id="fs">儲存</button><button class="big ghost" id="fx">取消</button>`);
 $('#fx').onclick=closeSheet;
 $('#ocrb').onclick=()=>$('#ocrf').click();$('#ocrf').onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)runOcr(f);e.target.value=''};
 const rd=k=>{const o={};LF.forEach(([x])=>{const v=$('#'+k+'_'+x).value.trim();o[x]=(x=='no'||x=='pnr'||x=='term'||x=='gate')?v.toUpperCase():v});o.from=$('#'+k+'_from').value;o.to=$('#'+k+'_to').value;return o};

/* ---- expenses ---- */
function settle(){const b={},ids=allIds();Object.values(D.exp).forEach(e=>{const p=e.sp&&e.sp.length?e.sp:ids;b[e.by]=(b[e.by]||0)+e.amt;p.forEach(i=>b[i]=(b[i]||0)-e.amt/p.length)});
 const cr=[],de=[];Object.entries(b).forEach(([i,v])=>{if(v>.5)cr.push([i,v]);else if(v<-.5)de.push([i,-v])});cr.sort((a,c)=>c[1]-a[1]);de.sort((a,c)=>c[1]-a[1]);
 const out=[];let i=0,j=0;while(i<cr.length&&j<de.length){const m=Math.min(cr[i][1],de[j][1]);out.push([de[j][0],cr[i][0],m]);cr[i][1]-=m;de[j][1]-=m;if(cr[i][1]<.5)i++;if(de[j][1]<.5)j++}return{b,out}}
function expView(){
 const E=Object.entries(D.exp).map(([id,e])=>({id,...e})).sort((a,b)=>b.ts-a.ts),{b,out}=settle(),tot=E.reduce((s,e)=>s+e.amt,0);
 let h=`<div class="card"><b>💴 即時平帳</b><span style="float:right;opacity:.7;font-size:13px">總共 ¥${fnum(tot)} ≈ NT$${fnum(tot*rate())}</span>`;
 h+=out.length?out.map(([f,t,m])=>`<div class="kv"><span>${esc(nameOf(f))} → ${esc(nameOf(t))}</span><b class="neg">¥${fnum(m)}<small style="font-weight:400"> ≈NT$${fnum(m*rate())}</small></b></div>`).join(''):'<div style="opacity:.7;font-size:13px;margin-top:6px">目前沒有人欠錢 🎉</div>';
 h+=`<div class="lab" style="margin-top:10px">每人淨額</div>`+allIds().map(i=>`<div class="kv"><span>${esc(nameOf(i))}</span><b class="${(b[i]||0)>=0?'pos':'neg'}">${(b[i]||0)>=0?'+':'−'}¥${fnum(Math.abs(b[i]||0))}</b></div>`).join('')+`</div>`;
 h+=`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b>匯率 ¥1 = NT$${rate().toFixed(4)}</b><div style="font-size:12px;opacity:.65">${info.rateAt?'更新於 '+esc(info.rateAt):'預設估計值，出發前請更新'}</div></div><button class="opt" id="rt2">更新</button></div>`;
 h+=`<button class="big" id="ae">＋ 新增一筆花費</button>`;
 E.forEach(e=>{h+=`<div class="stop"><div style="flex:1"><b>${esc(e.t)}</b><div style="font-size:12px;opacity:.7">${esc(nameOf(e.by))} 付 · ${(e.sp&&e.sp.length)||allIds().length} 人分</div></div><b style="text-align:right">¥${fnum(e.amt)}<div style="font-size:11px;opacity:.6;font-weight:400">${e.cur==='TWD'?'輸入 NT$'+fnum(e.orig):'≈NT$'+fnum(e.amt*rate())}</div></b><button class="x" data-x="${e.id}">✕</button></div>`});
 $('#view').innerHTML=h;$('#ae').onclick=expSheet;$('#rt2').onclick=rateSheet;$('#view').querySelectorAll('[data-x]').forEach(x=>x.onclick=()=>del('exp',x.dataset.x));
}
function expSheet(){
 const ids=allIds();
 openSheet(`<h3 style="margin:0 0 6px">新增花費</h3><div class="lab">項目</div><input type="text" id="et" placeholder="例：一蘭拉麵"><div class="lab">金額</div><div style="display:flex;gap:6px"><select id="ec" style="width:105px"><option value="JPY">¥ 日圓</option><option value="TWD">NT$ 台幣</option></select><input type="number" inputmode="decimal" id="ea" placeholder="3200"></div><div id="ep" style="font-size:12px;opacity:.65;margin-top:4px"></div><div class="lab">誰付的</div><select id="eb">${ids.map(i=>`<option value="${i}">${esc(nameOf(i))}</option>`).join('')}</select><div class="lab">平分給（取消勾選＝不用分）</div><div class="row">${ids.map(i=>`<label class="opt"><input type="checkbox" style="width:auto" data-s="${i}" checked> ${esc(nameOf(i))}</label>`).join('')}</div><button class="big" id="es">儲存</button><button class="big ghost" id="ex">取消</button>`);
 $('#eb').value=uid;$('#ex').onclick=closeSheet;
 const pv=()=>{const a=parseFloat($('#ea').value)||0,t=$('#ec').value==='TWD';$('#ep').textContent=a?(t?`≈ ¥${fnum(a/rate())}`:`≈ NT$${fnum(a*rate())}`):''};$('#ea').oninput=pv;$('#ec').onchange=pv;
 $('#es').onclick=()=>{const t=$('#et').value.trim(),a=parseFloat($('#ea').value);if(!t||!(a>0))return;const sp=[...sheet.querySelectorAll('[data-s]')].filter(c=>c.checked).map(c=>c.dataset.s);if(!sp.length)return;closeSheet();{const tw=$('#ec').value==='TWD';put('exp',Date.now().toString(36)+uid.slice(0,3),{t,amt:tw?Math.round(a/rate()):a,cur:tw?'TWD':'JPY',orig:a,by:$('#eb').value,sp,ts:Date.now()})}};
}
